<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        h1{
            text-align: center;
        }
        table{
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        td{
            padding: 10px;
        }
        input, select, textarea{
            width: 100%;
            padding: 6px;
        }
        .buttons{
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Hotel Room Booking Form</h1>

<form>
<table border="1">

    <tr>
        <td>Full Name</td>
        <td><input type="text" name="fullname" placeholder="Enter your name" required></td>
    </tr>

    <tr>
        <td>Email</td>
        <td><input type="email" name="email" placeholder="Enter your email" required></td>
    </tr>

    <tr>
        <td>Phone Number</td>
        <td><input type="tel" name="phone" placeholder="Enter phone number"></td>
    </tr>

    <tr>
        <td>Check-in Date</td>
        <td><input type="date" name="checkin"></td>
    </tr>

    <tr>
        <td>Check-out Date</td>
        <td><input type="date" name="checkout"></td>
    </tr>

    <tr>
        <td>Room Type</td>
        <td>
            <select name="roomtype">
                <option value="">--Select Room Type--</option>
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="suite">Suite Room</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Number of Guests</td>
        <td><input type="number" name="guests" min="1" max="10"></td>
    </tr>

    <tr>
        <td>Facilities Required</td>
        <td>
            <input type="checkbox" name="wifi"> WiFi<br>
            <input type="checkbox" name="ac"> AC<br>
            <input type="checkbox" name="breakfast"> Breakfast
        </td>
    </tr>

    <tr>
        <td>Special Requests</td>
        <td><textarea name="requests" rows="4" placeholder="Enter any special requests"></textarea></td>
    </tr>

    <tr class="buttons">
        <td colspan="2">
            <button type="submit">Book Now</button>
            <button type="reset">Clear Form</button>
        </td>
    </tr>

</table>
</form>

</body>
</html>
